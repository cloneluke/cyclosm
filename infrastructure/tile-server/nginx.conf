events { 
    worker_connections 1024; 
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types application/json application/octet-stream;

    server {
        listen 80;
        server_name _;
        root /data;

        # Health check endpoint
        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Serve all .pmtiles files with proper headers for byte-range requests
        location ~ \.pmtiles$ {
            # Disable gzip compression for pmtiles (they're already compressed)
            gzip off;
            
            # Critical headers for PMTiles HTTP Byte Serving
            add_header Accept-Ranges bytes always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range" always;
            add_header Cache-Control "public, max-age=86400" always;
            add_header Content-Type "application/octet-stream" always;
            
            # Use sendfile for efficient file serving
            sendfile on;
            sendfile_max_chunk 1m;
            
            # Allow range requests
            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # Default location for everything else in /data
        location / {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            
            if ($request_method = OPTIONS) {
                return 204;
            }
        }
    }
}
