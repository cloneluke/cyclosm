events { 
    worker_connections 1024; 
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types application/json application/octet-stream;

    server {
        listen 80;
        server_name _;

        root /data;

        # Health check endpoint
        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # PMTiles vector tiles endpoint
        location ~ ^/tiles/(?<z>\d+)/(?<x>\d+)/(?<y>\d+)\.pbf$ {
            # Serve PMTiles file with HTTP range request support
            alias /data/tiles.pmtiles;
            
            # Cache headers
            add_header Cache-Control "public, max-age=86400, immutable";
            add_header ETag "\"cycling-tiles-v1\"";
            
            # CORS for web clients
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Vary "Accept-Encoding";
            
            # Enable range requests for efficient tile loading
            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # Serve tiles.pmtiles directly for PMTiles clients
        location /tiles.pmtiles {
            alias /data/tiles.pmtiles;
            
            add_header Cache-Control "public, max-age=86400";
            add_header Access-Control-Allow-Origin "*";
            
            # Support range requests
            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # 404 for missing files
        location = /404.html {
            internal;
        }
    }
}
