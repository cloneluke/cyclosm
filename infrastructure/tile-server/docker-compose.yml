version: '3.8'

services:
  planetiler:
    build: .
    container_name: cyclosm-planetiler
    environment:
      PLANETILER_MEMORY: "8g"
      OSM_SOURCE: "colorado"
    volumes:
      - ./data:/data
    entrypoint: ["/entrypoint.sh"]
    command: ["tile-generation"]
    profiles: ["tile-generation"]

  tile-server:
    build: .
    container_name: cyclosm-tile-server
    ports:
      - "8080:80"
    volumes:
      - ./data:/data:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    entrypoint: ["/entrypoint.sh"]
    command: ["tile-server"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    # Keep this running for development
