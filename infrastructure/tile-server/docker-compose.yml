version: '3.8'

services:
  planetiler:
    build: .
    container_name: cyclosm-planetiler
    environment:
      # Adjust these for your region/machine
      PLANETILER_MEMORY: "8g"
      # For MVP, use a region extract instead of full planet
      # Options: 
      # - https://planet.openstreetmap.org/pbf/planet-latest.osm.pbf (full planet, ~70GB)
      # - Use geofabrik for specific regions: https://download.geofabrik.de/
      OSM_SOURCE: "https://download.geofabrik.de/north-america/us/colorado-latest.osm.pbf"
    volumes:
      - ./data:/data
      - ./planetiler-config.yaml:/config.yaml
    entrypoint: ["/entrypoint.sh"]
    command: ["tile-generation"]
    profiles: ["tile-generation"]
    # For MVP: run this once to generate tiles, then stop

  tile-server:
    build: .
    container_name: cyclosm-tile-server
    ports:
      - "8080:80"
    volumes:
      - ./data:/data:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    entrypoint: ["/entrypoint.sh"]
    command: ["tile-server"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    # Keep this running for development
