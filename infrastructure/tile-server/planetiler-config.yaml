schema_name: CyclOSM Cycling Map
schema_description: A map focused on cycling infrastructure and amenities
attribution: <a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>

sources:
  osm:
    type: osm
    url: "geofabrik:colorado"

layers:
  # Roads for cycling navigation
  - id: roads
    features:
      - source: osm
        geometry: line
        include_when:
          highway: [primary, secondary, tertiary, residential, unclassified, living_street, cycleway]
        attributes:
          - key: highway
          - key: name

  # Water features for context
  - id: water
    features:
      - source: osm
        geometry: polygon
        include_when:
          natural: water
        attributes:
          - key: name

  # Points of interest for cyclists
  - id: poi
    features:
      - source: osm
        geometry: point
        include_when:
          amenity: [cafe, restaurant, fast_food, pharmacy]
        attributes:
          - key: amenity
          - key: name

      - source: osm
        geometry: point
        include_when:
          shop: bicycle
        attributes:
          - key: shop
          - key: name

examples:
  - name: Primary road
    input:
      source: osm
      geometry: line
      tags:
        highway: primary
    output:
      - layer: roads
        geometry: line
        tags:
          highway: primary

  - name: Cycleway
    input:
      source: osm
      geometry: line
      tags:
        highway: cycleway
    output:
      - layer: roads
        geometry: line
        tags:
          highway: cycleway

  - name: Water body
    input:
      source: osm
      geometry: polygon
      tags:
        natural: water
    output:
      - layer: water
        geometry: polygon
        tags:
          natural: water

  - name: Cafe
    input:
      source: osm
      geometry: point
      tags:
        amenity: cafe
    output:
      - layer: poi
        geometry: point
        tags:
          amenity: cafe
